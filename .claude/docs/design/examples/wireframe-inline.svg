<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f5f5"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#ddd" stroke="#999" stroke-width="2"/>
  
  <!-- Logo -->
  <rect x="20" y="10" width="120" height="40" fill="#ccc" stroke="#999"/>
  <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">LOGO</text>
  
  <!-- Header Buttons -->
  <rect x="600" y="15" width="80" height="30" fill="#ccc" stroke="#999"/>
  <text x="640" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Search</text>
  
  <rect x="690" y="15" width="90" height="30" fill="#ccc" stroke="#999"/>
  <text x="735" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">User Menu</text>
  
  <!-- Sidebar -->
  <rect x="0" y="60" width="200" height="540" fill="#eee" stroke="#ccc"/>
  
  <!-- Sidebar Items -->
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="10" y="80" width="180" height="40" fill="#999"/>
    <text x="100" y="105" text-anchor="middle" fill="#fff">Dashboard</text>
    
    <rect x="10" y="130" width="180" height="40" fill="#f5f5f5"/>
    <text x="100" y="155" text-anchor="middle" fill="#333">Analytics</text>
    
    <rect x="10" y="180" width="180" height="40" fill="#f5f5f5"/>
    <text x="100" y="205" text-anchor="middle" fill="#333">Projects</text>
    
    <rect x="10" y="230" width="180" height="40" fill="#f5f5f5"/>
    <text x="100" y="255" text-anchor="middle" fill="#333">Team</text>
  </g>
  
  <!-- Main Content Area -->
  <rect x="200" y="60" width="600" height="540" fill="#fff"/>
  
  <!-- Page Title -->
  <text x="220" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">Dashboard</text>
  <text x="220" y="125" font-family="Arial, sans-serif" font-size="14" fill="#666">Welcome back, here's your overview</text>
  
  <!-- Stats Cards -->
  <g>
    <!-- Card 1 -->
    <rect x="220" y="150" width="130" height="120" fill="#f9f9f9" stroke="#ddd" stroke-width="2"/>
    <rect x="265" y="170" width="40" height="40" fill="#e5e5e5" stroke="#999" stroke-dasharray="2,2"/>
    <text x="285" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">1,234</text>
    <text x="285" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Total Items</text>
    
    <!-- Card 2 -->
    <rect x="360" y="150" width="130" height="120" fill="#f9f9f9" stroke="#ddd" stroke-width="2"/>
    <rect x="405" y="170" width="40" height="40" fill="#e5e5e5" stroke="#999" stroke-dasharray="2,2"/>
    <text x="425" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">+23%</text>
    <text x="425" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Growth</text>
    
    <!-- Card 3 -->
    <rect x="500" y="150" width="130" height="120" fill="#f9f9f9" stroke="#ddd" stroke-width="2"/>
    <rect x="545" y="170" width="40" height="40" fill="#e5e5e5" stroke="#999" stroke-dasharray="2,2"/>
    <text x="565" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">456</text>
    <text x="565" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Active Users</text>
    
    <!-- Card 4 -->
    <rect x="640" y="150" width="130" height="120" fill="#f9f9f9" stroke="#ddd" stroke-width="2"/>
    <rect x="685" y="170" width="40" height="40" fill="#e5e5e5" stroke="#999" stroke-dasharray="2,2"/>
    <text x="705" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">$12.3k</text>
    <text x="705" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Revenue</text>
  </g>
  
  <!-- Chart Area -->
  <rect x="220" y="290" width="370" height="200" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <text x="405" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Activity Chart</text>
  <rect x="240" y="340" width="330" height="130" fill="#e5e5e5" stroke="#999" stroke-dasharray="2,2"/>
  <text x="405" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">LINE CHART</text>
  
  <!-- Pie Chart -->
  <rect x="600" y="290" width="170" height="200" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <text x="685" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Distribution</text>
  <circle cx="685" cy="400" r="50" fill="#e5e5e5" stroke="#999" stroke-dasharray="2,2"/>
  <text x="685" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">PIE CHART</text>
  
  <!-- Table Header -->
  <rect x="220" y="510" width="550" height="40" fill="#eee" stroke="#ddd" stroke-width="2"/>
  <text x="240" y="535" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Recent Activity</text>
  <rect x="680" y="520" width="80" height="25" fill="#999"/>
  <text x="720" y="537" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Export</text>
</svg>